<style>
    #sidebar {
        width: 250px;
        height: 100vh;
        background: white;
        box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
    }

    /* Kondisi Sidebar Sembunyi */
    #sidebar.hidden {
        transform: translateX(-250px);
    }

    #main {
        flex: 1;
        margin-left: 250px; /* Jarak default sidebar */
        padding: 30px;
        transition: margin-left 0.3s;
    }

    /* Saat sidebar sembunyi, main content jadi penuh */
    #main.full-width {
        margin-left: 0;
    }

    .toggle-btn {
        font-size: 20px;
        cursor: pointer;
        padding: 10px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        margin-right: 20px;
    }

    @media (max-width: 768px) {
        #main { margin-left: 0; }
    }
</style>

<div id="sidebar">
    <div class="sidebar-header">
        <h3 style="color: var(--blue);">TryoutUTBK</h3>
    </div>
    <div class="menu-list">
        <div class="menu-item active" onclick="showSection('home', this)"><i class="fas fa-home"></i> Home</div>
        <div class="menu-item" onclick="showSection('tryout', this)"><i class="fas fa-edit"></i> Tryout</div>
        <div class="menu-item" onclick="showSection('hasil', this)"><i class="fas fa-poll"></i> Hasil</div>
        <div class="menu-item" style="color: #ff4757; margin-top: 50px;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>
</div>

<div id="main">
    <div class="top-bar">
        <div class="toggle-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <h2 id="section-title">Home</h2>
    </div>
    
    </div>

<script>
// Logika Menu Buka Tutup
function toggleMenu() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("main");
    
    sidebar.classList.toggle("hidden");
    main.classList.toggle("full-width");
}

// Logika Load User dengan Proteksi Force Logout
function loadUser() {
    const userEmail = sessionStorage.getItem("user_email");
    if (!userEmail) { logout(); return; }

    fetch(`${API}?action=get_user&email=${userEmail}`)
    .then(r => r.json())
    .then(d => {
        // Cek jika akun dihapus admin dari sheet 'user'
        if (d.status === "force_logout") {
            alert("⚠️ Akun Anda tidak ditemukan atau telah dinonaktifkan.");
            logout();
            return;
        }

        document.getElementById("loading-home").style.display = "none";
        if (d.data_lengkap) {
            document.getElementById("view-biodata").style.display = "block";
            document.getElementById("txt-nama").innerText = d.nama;
            document.getElementById("txt-sekolah").innerText = d.sekolah;
            document.getElementById("txt-wa").innerText = d.wa;
        } else {
            document.getElementById("form-biodata").style.display = "block";
        }
    })
    .catch(err => {
        console.error("Error loading data:", err);
    });
}

function logout() {
    sessionStorage.clear();
    window.location.href = "index.html"; // Sesuaikan nama file login Anda
}

loadUser();
</script>
