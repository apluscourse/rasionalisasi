<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUIS A+ COURSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Perbaikan: Mengizinkan scroll saat gambar lebih besar dari box */
        .box-soal { 
            position: relative; 
            overflow: auto; 
            border: 2px solid #e5e7eb; 
            border-radius: 8px; 
            max-height: 70vh; /* Agar tidak terlalu panjang di HP */
            background-color: #f8fafc;
        }
        #imgSoal { 
            width: 100%; 
            transition: transform 0.2s; 
            transform-origin: top left; 
            display: block;
        }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 20px; border-radius: 99px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-100 p-2 sm:p-4 text-slate-800">

    <div id="loading-overlay">
        <div class="loader"></div>
        <p class="mt-4 font-bold text-blue-600">Memproses...</p>
    </div>

    <div id="toast-msg">Jawaban Tersimpan!</div>

    <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-xl p-4 sm:p-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-center text-blue-800 mb-6">KUIS A+ COURSE</h1>

        <div id="setup-area" class="space-y-4">
            <select id="selKelas" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-400" onchange="updateSiswaDanMapel()">
                <option value="">-- Pilih Kelas --</option>
            </select>
            <select id="selSiswa" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Pilih Nama Siswa --</option>
            </select>
            <select id="selMapel" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Pilih Mata Pelajaran --</option>
            </select>
            <button onclick="persiapanMulai()" id="btnMulai" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 active:scale-95 transition">MULAI KUIS</button>
        </div>

        <div id="quiz-area" class="hidden">
            <div id="countdown" class="text-7xl font-bold text-center py-20 text-blue-600"></div>
            
            <div id="main-quiz" class="hidden">
                <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-800 text-white p-3 rounded-t-lg gap-3">
                    <div id="timerDisplay" class="text-xl font-mono font-bold text-yellow-400">00:00:00:00</div>
                    <div class="flex gap-2">
                        <button onclick="zoom(0.2)" class="bg-blue-500 px-3 py-1 rounded text-xs font-bold">Zoom In (+)</button>
                        <button onclick="zoom(-0.2)" class="bg-red-500 px-3 py-1 rounded text-xs font-bold">Zoom Out (-)</button>
                        <button onclick="reloadImg()" class="bg-slate-600 px-3 py-1 rounded text-xs">Reload</button>
                    </div>
                </div>

                <div class="box-soal bg-white p-1 mb-4">
                    <img id="imgSoal" src="" alt="Soal">
                </div>

                <div id="nomor-pills" class="flex flex-wrap gap-2 mb-6 justify-center"></div>

                <div class="flex flex-col sm:flex-row gap-2 mb-6">
                    <input type="text" id="ansInput" class="flex-1 border-2 border-blue-200 p-3 rounded-lg text-center font-bold uppercase focus:border-blue-500 outline-none" placeholder="Jawaban...">
                    <button onclick="saveAns()" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold active:scale-95 transition">SIMPAN</button>
                </div>

                <button onclick="finishQuiz()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700">SELESAIKAN KUIS</button>
            </div>
        </div>

        <div id="result-area" class="hidden text-center">
            <div id="nilaiBesar" class="text-5xl sm:text-6xl font-black text-blue-700 py-10"></div>
            <button onclick="showReview()" class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold">Lihat Kunci Jawaban</button>
            <div id="review-list" class="hidden mt-8 text-left space-y-8"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://script.google.com/macros/s/AKfycbzm6VUbpLdcQt_cVjWMcHo_skxunNqnyVJaXP5uWXmts4EyHS62wdjW9P5vTkr80EJP/exec'; 
        
        let dbSiswa = [], dataSoal = [], userAnswers = {};
        let idx = 0, scale = 1, timer, timeRemainingMs;

        window.onload = () => { document.getElementById('loading-overlay').style.display = 'none'; fetchInitial(); };

        function fetchInitial() {
            fetch(`${BASE_URL}?action=getInitial`)
                .then(res => res.json())
                .then(data => {
                    dbSiswa = data.siswa;
                    const el = document.getElementById('selKelas');
                    data.kelasUnique.forEach(k => el.innerHTML += `<option value="${k}">${k}</option>`);
                });
        }

        function updateSiswaDanMapel() {
            const kls = document.getElementById('selKelas').value;
            if(!kls) return;
            const sEl = document.getElementById('selSiswa');
            sEl.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
            dbSiswa.filter(s => s.kelas == kls).forEach(s => sEl.innerHTML += `<option value="${s.nama}">${s.nama}</option>`);
            
            fetch(`${BASE_URL}?action=getMapel&kelas=${kls}`)
                .then(res => res.json())
                .then(mapels => {
                    const mEl = document.getElementById('selMapel');
                    mEl.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
                    mapels.forEach(m => mEl.innerHTML += `<option value="${m}">${m}</option>`);
                });
        }

        function persiapanMulai() {
            const kls = document.getElementById('selKelas').value;
            const mpl = document.getElementById('selMapel').value;
            const sis = document.getElementById('selSiswa').value;
            if(!kls || !mpl || !sis) return alert("Lengkapi data!");

            document.getElementById('loading-overlay').style.display = 'flex';

            fetch(`${BASE_URL}?action=getSoal&kelas=${kls}&mapel=${mpl}`)
                .then(res => res.json())
                .then(res => {
                    dataSoal = res;
                    document.getElementById('loading-overlay').style.display = 'none';
                    startCountdown();
                });
        }

        function startCountdown() {
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            let c = 3;
            const cd = document.getElementById('countdown');
            const timerIv = setInterval(() => {
                cd.innerText = c;
                if(c === 0) { clearInterval(timerIv); cd.classList.add('hidden'); document.getElementById('main-quiz').classList.remove('hidden'); initQuiz(); }
                c--;
            }, 1000);
        }

        // FIX TIMER: Menangani angka 900 sebagai detik
        function initQuiz() {
            let waktuDariDB = parseFloat(dataSoal[0].waktu); // 900
            timeRemainingMs = waktuDariDB * 1000; // Ubah ke milidetik
            renderSoal();
            timer = setInterval(() => {
                timeRemainingMs -= 50;
                document.getElementById('timerDisplay').innerText = formatTimeLong(timeRemainingMs);
                if(timeRemainingMs <= 0) { clearInterval(timer); finishQuiz(true); }
            }, 50);
        }

        function formatTimeLong(ms) {
            if (ms < 0) ms = 0;
            let totalSecs = Math.floor(ms / 1000);
            let h = Math.floor(totalSecs / 3600);
            let m = Math.floor((totalSecs % 3600) / 60);
            let s = totalSecs % 60;
            let mil = Math.floor((ms % 1000) / 10);
            let pad = (n) => n.toString().padStart(2, '0');
            return `${pad(h)}:${pad(m)}:${pad(s)}:${pad(mil)}`;
        }

        function renderSoal() {
            const s = dataSoal[idx];
            const img = document.getElementById('imgSoal');
            img.src = s.soalUrl;
            img.style.transform = `scale(${scale})`; // Tetapkan zoom saat pindah soal
            document.getElementById('ansInput').value = userAnswers[idx] || "";
            
            const p = document.getElementById('nomor-pills');
            p.innerHTML = "";
            dataSoal.forEach((_, i) => {
                const active = i === idx ? 'bg-blue-600 text-white' : (userAnswers[i] ? 'bg-green-200 border-green-500' : 'bg-gray-200');
                p.innerHTML += `<button onclick="go(${i})" class="w-10 h-10 rounded-full font-bold border-2 ${active}">${i+1}</button>`;
            });
        }

        function go(i) { userAnswers[idx] = document.getElementById('ansInput').value.toUpperCase(); idx = i; renderSoal(); }

        function saveAns() { 
            userAnswers[idx] = document.getElementById('ansInput').value.toUpperCase(); 
            renderSoal();
            const toast = document.getElementById('toast-msg');
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 1000);
        }

        // ZOOM FITUR: Gambar bisa digeser karena CSS overflow:auto
        function zoom(v) { 
            scale = Math.min(Math.max(1, scale + v), 4); 
            document.getElementById('imgSoal').style.transform = `scale(${scale})`; 
        }

        function reloadImg() { const img = document.getElementById('imgSoal'); img.src = img.src.split('?')[0] + '?t=' + Date.now(); }

function finishQuiz(auto = false) {
    if(!auto && !confirm("Kirim jawaban sekarang?")) return;
    clearInterval(timer);
    
    // Pastikan jawaban terakhir tersimpan
    userAnswers[idx] = document.getElementById('ansInput').value.toUpperCase(); 

    let benar = 0;
    dataSoal.forEach((s, i) => { 
        if((userAnswers[i]||"") === s.kunci.toUpperCase()) benar++; 
    });
    const skor = (benar / dataSoal.length) * 100;

    // Payload ini dibuat persis seperti versi awal Anda yang berhasil
    const hasil = {
        nama: document.getElementById('selSiswa').value,
        kelas: document.getElementById('selKelas').value,
        mapel: document.getElementById('selMapel').value,
        nilai: skor.toFixed(2)
    };

    document.getElementById('loading-overlay').style.display = 'flex';

    // Gunakan fetch sederhana seperti versi awal Anda
    fetch(BASE_URL, { 
        method: 'POST', 
        body: JSON.stringify(hasil) 
    })
    .then(() => {
        document.getElementById('loading-overlay').style.display = 'none';
        tampilkanHasil(skor);
    })
    .catch(err => {
        // Jika error tetap tampilkan hasil agar siswa tidak bingung
        console.error(err);
        document.getElementById('loading-overlay').style.display = 'none';
        tampilkanHasil(skor);
    });
}

        function tampilkanHasil(skor) {
            document.getElementById('quiz-area').classList.add('hidden'); 
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('nilaiBesar').innerHTML = `<p class='text-xl'>Skor Akhir:</p>${skor.toFixed(2)}`;
        }

        function showReview() {
            const list = document.getElementById('review-list');
            list.classList.remove('hidden');
            list.innerHTML = "";
            dataSoal.forEach((s, i) => {
                const u = userAnswers[i] || "-";
                const isBenar = u === s.kunci.toUpperCase();
                list.innerHTML += `<div class="border-b pb-4">
                    <p class="font-bold">No. ${i+1}</p>
                    <img src="${s.soalUrl}" class="w-full mb-2 border rounded">
                    <p class="${isBenar ? 'text-green-600' : 'text-red-600'} font-bold">Jawaban Anda: ${u} ${isBenar ? '✅' : '❌'}</p>
                    <p>Kunci: ${s.kunci}</p>
                </div>`;
            });
        }
    </script>
</body>
</html>
