<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Timer</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
margin:0;
background:#eaf4ff;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#1e88ff;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d5e6ff;
margin-top:10px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:16px;
cursor:pointer;
}

.btn{
background:#1e88ff;
color:white;
}

.btn:hover{
background:#0d6efd;
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f3f8ff;
}

.benar{
color:green;
font-weight:600;
}

.salah{
color:red;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<h1>Admin Timer</h1>

<input id="no" placeholder="Nomor soal">

<button class="btn" onclick="tampil()">Tampilkan</button>

<div class="table-wrap">
<div id="tabel"></div>
</div>

<div class="controls">

<input id="kunci" placeholder="Kunci jawaban">

<button class="btn" onclick="proses()">Proses</button>

<button onclick="reset()">Reset</button>

<button onclick="lihatNilai()">Lihat Nilai</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzAe3LX2rf7Q6B-OzGd5sFGmCfa-SFTMC50Wb5s_KSp3fXVL-XDpUsN1tluUy-ZanxPZA/exec";

/* =======================
FORMAT DETIK → MM:SS
======================= */

function formatWaktu(d){

let m=Math.floor(d/60);
let s=d%60;

return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');

}

/* =======================
TAMPIL DATA SOAL
======================= */

function tampil(){

let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"get",
no:no
})
})
.then(res=>res.json())
.then(res=>{

let html="<table>";
html+="<tr><th>Nama</th><th>Jawaban</th><th>Sisa Waktu</th></tr>";

res.forEach(r=>{

let warna="";

if(r[4]=="1") warna="benar";
if(r[4]=="0") warna="salah";

html+=`
<tr class="${warna}">
<td>${r[0]}</td>
<td>${r[2]}</td>
<td>${formatWaktu(Number(r[3]))}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("tabel").innerHTML=html;

});

}

/* =======================
PROSES PENILAIAN
======================= */

function proses(){

let kunci=document.getElementById("kunci").value;
let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({

action:"score",
kunci:kunci,
no:no

})

}).then(()=>{

document.getElementById("tabel").innerHTML="";

setTimeout(()=>{

tampil();

},500);

});

}

/* =======================
RESET TABEL
======================= */

function reset(){

document.getElementById("tabel").innerHTML="";

}

/* =======================
LIHAT NILAI
======================= */

function lihatNilai(){

document.getElementById("tabel").innerHTML="";

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"getall"
})
})
.then(res=>res.json())
.then(res=>{

let siswa={};

res.forEach(r=>{

let nama=r[0];
let soal=r[1];
let skor=r[4];

if(!siswa[nama]){

siswa[nama]={benar:[],salah:[]};

}

if(skor=="1") siswa[nama].benar.push(soal);
if(skor=="0") siswa[nama].salah.push(soal);

});

let html="<table>";
html+="<tr><th>Nama</th><th>Benar</th><th>Salah</th><th>Nilai</th></tr>";

for(let nama in siswa){

let benar=siswa[nama].benar;
let salah=siswa[nama].salah;

let total=benar.length+salah.length;

let nilai=Math.round((benar.length/total)*100);

html+=`
<tr>
<td>${nama}</td>
<td class="benar">${benar.join(",")}</td>
<td class="salah">${salah.join(",")}</td>
<td>${nilai}</td>
</tr>
`;

}

html+="</table>";

document.getElementById("tabel").innerHTML=html;

});

}

</script>

</body>
</html>
