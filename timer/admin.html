<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Timer</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
margin:0;
background:#eaf4ff;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#1e88ff;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d5e6ff;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:16px;
cursor:pointer;
}

.btn{
background:#1e88ff;
color:white;
}

.btn:hover{
background:#0d6efd;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
min-width:400px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f3f8ff;
}

.benar{
color:green;
font-weight:600;
}

.salah{
color:red;
font-weight:600;
}

@media(min-width:600px){

button{
width:auto;
padding:10px 16px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

}

</style>

</head>

<body>

<div class="card">

<h1>Admin Timer</h1>

<input id="no" placeholder="Nomor soal">

<button class="btn" onclick="tampil()">Tampilkan</button>

<div class="table-wrap">
<div id="tabel"></div>
</div>

<div class="controls">

<input id="kunci" placeholder="Kunci jawaban">

<button class="btn" onclick="proses()">Proses</button>

<button onclick="reset()">Reset</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyGRR6WfeOVX_koRX3cOKTMTiPzuz_iIZyb2yAlxQJVrl6UlQP_CB0k3mBCB60qR062ig/exec";

let data=[];

/* =========================
FORMAT DETIK → MM:SS
========================= */

function formatWaktu(detik){

let m=Math.floor(detik/60);
let s=detik%60;

return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');

}

/* =========================
TAMPILKAN DATA
========================= */

function tampil(){

let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"get",
no:no
})
})
.then(res=>res.json())
.then(res=>{

data=res;

let html="<table>";
html+="<tr><th>Nama</th><th>Jawaban</th><th>Sisa Waktu</th></tr>";

res.forEach(r=>{

let warna="";

if(r[4]=="1") warna="benar";
if(r[4]=="0") warna="salah";

html+=`
<tr class="${warna}">
<td>${r[0]}</td>
<td>${r[2]}</td>
<td>${formatWaktu(Number(r[3]))}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("tabel").innerHTML=html;

});

}

/* =========================
PROSES PENILAIAN
========================= */

function proses(){

let kunci=document.getElementById("kunci").value;
let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({

action:"score",
kunci:kunci,
no:no

})

}).then(()=>{

/* bersihkan tabel */
document.getElementById("tabel").innerHTML="";

/* panggil ulang data */
setTimeout(()=>{

tampil();

},500);

});

}

/* =========================
RESET TAMPILAN
========================= */

function reset(){

document.getElementById("tabel").innerHTML="";

}

</script>

</body>
</html>
