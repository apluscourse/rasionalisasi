<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{

margin:0;
background:#eaf4ff;
padding:40px;

}

.card{

background:white;
padding:30px;
border-radius:14px;
box-shadow:0 8px 30px rgba(0,0,0,0.08);
max-width:900px;
margin:auto;

}

h1{

color:#1e88ff;
text-align:center;

}

input{

padding:10px;
border-radius:8px;
border:1px solid #d5e6ff;
margin-top:10px;
width:200px;

}

button{

padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;

}

.btn{

background:#1e88ff;
color:white;

}

.btn:hover{

background:#0d6efd;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th,td{

padding:10px;
border-bottom:1px solid #eee;
text-align:center;

}

th{

background:#f3f8ff;

}

.benar{

color:green;
font-weight:600;

}

.salah{

color:red;
font-weight:600;

}

.controls{

margin-top:20px;

}

</style>

</head>

<body>

<div class="card">

<h1>Admin Timer</h1>

<input id="no" placeholder="Nomor soal">

<button class="btn" onclick="tampil()">Tampilkan</button>

<div id="tabel"></div>

<div class="controls">

<input id="kunci" placeholder="Kunci jawaban">

<br>

<button class="btn" onclick="proses()">Proses</button>

<button onclick="reset()">Reset</button>

<button onclick="lihatNilai()">Lihat Nilai</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyGRR6WfeOVX_koRX3cOKTMTiPzuz_iIZyb2yAlxQJVrl6UlQP_CB0k3mBCB60qR062ig/exec";

let data=[];

function tampil(){

let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"get",
no:no
})
})
.then(res=>res.json())
.then(res=>{

data=res;

let html="<table>";

html+="<tr><th>Nama</th><th>Jawaban</th><th>Sisa Waktu</th></tr>";

res.forEach(r=>{

html+=`
<tr>
<td>${r[0]}</td>
<td>${r[2]}</td>
<td>${r[3]}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("tabel").innerHTML=html;

});

}

function proses(){

let kunci=document.getElementById("kunci").value;
let no=document.getElementById("no").value;

fetch(API,{
method:"POST",
body:JSON.stringify({

action:"score",
kunci:kunci,
no:no

})

}).then(()=>{

alert("Penilaian selesai");

});

}

function reset(){

document.getElementById("tabel").innerHTML="";

}

function lihatNilai(){

alert("Fitur ini menghitung total skor dari database");

}

</script>

</body>
</html>
