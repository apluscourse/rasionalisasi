<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --cream:#f7f2e7; --panel:#faf6ec; --line:#8a7a5c; --line-soft:#cdbf9e;
      --ink:#3f3527; --muted:#8f8267; --sage:#6b7455; --sage-dark:#4f5a3d;
      --gold:#b08d4f; --border:#e4d9c2; --red:#a13d3d;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:'Jost',sans-serif; background:var(--cream); color:var(--ink); position:relative; overflow-x:hidden;}
    h1,h2,.serif{font-family:'Cormorant Garamond',serif;}

    .branch-decor{position:fixed; pointer-events:none; z-index:0; opacity:.35;}
    .branch-decor svg{width:100%; height:100%; display:block;}
    .branch-decor.tl{top:-10px; left:-10px; width:130px; height:130px;}
    .branch-decor.br{bottom:-10px; right:-10px; width:150px; height:150px; transform:scale(-1,-1);}
    .leaf-sway{animation:sway 7s ease-in-out infinite alternate;}
    @keyframes sway{ 0%{transform:rotate(-1.2deg);} 100%{transform:rotate(1.2deg);} }

    header{position:relative; z-index:2; text-align:center; padding:20px 16px 10px;}
    header h1{margin:0; font-size:24px; font-weight:600; color:var(--sage-dark);}
    .divider-orn{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px;}
    .divider-orn .ln{height:1px; width:50px; background:linear-gradient(90deg, transparent, var(--line-soft) 40%, var(--line-soft) 60%, transparent); position:relative; overflow:hidden;}
    .divider-orn .ln::after{content:''; position:absolute; top:0; left:-60%; width:60%; height:100%; background:linear-gradient(90deg, transparent, var(--gold), transparent); animation:shimmer 4.5s ease-in-out infinite;}
    @keyframes shimmer{ 0%{left:-60%;} 55%{left:110%;} 100%{left:110%;} }
    .divider-orn svg{width:18px; height:18px;}

    .tabs{display:flex; background:var(--panel); border:1px solid var(--border); border-radius:24px; max-width:340px; margin:14px auto 0; position:relative; z-index:2; padding:4px;}
    .tab{flex:1; text-align:center; padding:10px; cursor:pointer; font-weight:500; color:var(--muted); font-size:14px; border-radius:20px; transition:.25s;}
    .tab.active{color:#fff; background:var(--sage); box-shadow:0 3px 8px rgba(95,107,69,.3);}

    .container{padding:16px; max-width:800px; margin:0 auto; position:relative; z-index:2;}
    .view-enter{animation:fadeRise .4s cubic-bezier(.2,.7,.3,1) both;}
    @keyframes fadeRise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

    .frame{position:relative; background:var(--panel); border:1px solid var(--line-soft); border-radius:22px; padding:20px 18px; box-shadow:0 4px 18px rgba(90,75,45,.06);}
    .frame .corner{position:absolute; width:30px; height:30px; opacity:.8;}
    .frame .corner.c-tl{top:8px; left:8px;}
    .frame .corner.c-br{bottom:8px; right:8px; transform:scale(-1,-1);}

    button.primary{background:var(--sage); color:#fff; border:none; padding:12px 18px; border-radius:22px; font-weight:500; cursor:pointer; font-size:14px; font-family:'Jost',sans-serif; transition:.2s; box-shadow:0 3px 10px rgba(95,107,69,.25);}
    button.primary:hover{background:var(--sage-dark); box-shadow:0 5px 14px rgba(95,107,69,.35);}
    button.secondary{background:transparent; color:var(--sage-dark); border:1.4px solid var(--sage); padding:9px 15px; border-radius:20px; font-weight:500; cursor:pointer; font-size:13px; transition:.2s;}
    button.secondary:hover{background:var(--sage); color:#fff;}
    button.danger{background:transparent; color:var(--red); border:1.4px solid var(--red); padding:7px 12px; border-radius:18px; font-size:12.5px; cursor:pointer; transition:.2s;}
    button.danger:hover{background:var(--red); color:#fff;}

    select, input{width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; font-size:14px; margin-top:4px; font-family:'Jost',sans-serif; background:#fff; color:var(--ink);}
    select:focus, input:focus{outline:none; border-color:var(--sage);}
    label.field{display:block; font-size:12.5px; color:var(--muted); margin-top:12px;}

    .table-wrap{width:100%; overflow-x:auto; margin-top:16px; border-radius:12px; border:1px solid var(--border);}
    table{width:100%; min-width:420px; border-collapse:collapse; background:var(--cream); border-radius:12px; overflow:hidden;}
    th, td{padding:11px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--border);}
    tr:last-child td{border-bottom:none;}
    th{background:#efe6d3; color:var(--sage-dark); font-size:12px; font-weight:600;}
    td.actions{white-space:nowrap; display:flex; gap:6px;}
    tbody tr{transition:.15s;}
    tbody tr:hover{background:#fffdf7;}

    .card{background:var(--cream); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:14px;}
    .total-box{
      position:relative; background:linear-gradient(135deg, var(--sage), var(--sage-dark)); color:#fff; border-radius:20px;
      padding:28px 20px; text-align:center; margin-top:18px; box-shadow:0 6px 20px rgba(79,90,61,.35); overflow:hidden;
    }
    .total-box::before{
      content:''; position:absolute; top:-40%; left:-20%; width:60%; height:180%;
      background:rgba(255,255,255,.08); transform:rotate(20deg); animation:sheen 5s ease-in-out infinite;
    }
    @keyframes sheen{ 0%{left:-30%;} 50%{left:110%;} 100%{left:110%;} }
    .total-box .label{font-size:13px; opacity:.9; letter-spacing:.5px; position:relative;}
    .total-box .value{font-size:32px; font-weight:700; margin-top:4px; font-family:'Jost',sans-serif; position:relative;}
    .rp-bold{font-family:'Jost',sans-serif; font-weight:700;}

    .order-btn-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
    .order-btn-grid button{background:#fff; border:1.4px solid var(--sage); color:var(--sage-dark); padding:9px 14px; border-radius:18px; font-size:13px; cursor:pointer; transition:.2s;}
    .order-btn-grid button:hover{background:var(--sage); color:#fff; transform:translateY(-2px);}

    .overlay{position:fixed; inset:0; background:rgba(63,53,39,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
    .overlay.hidden{display:none;}
    .overlay:not(.hidden) .modal{animation:fadeRise .3s ease both;}
    .modal{background:var(--panel); width:100%; max-width:440px; border-radius:18px; padding:22px; max-height:88vh; overflow-y:auto; border:1px solid var(--line-soft);}
    .modal h2{margin-top:0; font-size:20px; font-weight:600;}

    #strukArea{background:#fff; color:#000; font-family:'Courier New', monospace; padding:14px; font-size:12.5px; line-height:1.55; border:1px solid #eee; border-radius:6px;}
    #strukArea hr{border:none; border-top:1px dashed #000; margin:8px 0;}
    #strukArea .row{display:flex; justify-content:space-between;}
    #strukArea .center{text-align:center;}

    .aksi-struk-admin{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
    .aksi-struk-admin button{margin:0; width:100%;}

    @media print{
      body *{visibility:hidden;}
      #strukArea, #strukArea *{visibility:visible;}
      #strukArea{position:absolute; top:0; left:0; width:100%;}
    }
    /* ---------- LOADING OVERLAY ---------- */
    .loading-overlay{
      position:fixed; inset:0; background:var(--cream); z-index:100;
      display:flex; align-items:center; justify-content:center;
      transition:opacity .35s ease;
    }
    .loading-overlay.hidden{ opacity:0; pointer-events:none; }
    .loading-box{ text-align:center; }
    .spinner{
      width:44px; height:44px; margin:0 auto 14px;
      border:4px solid var(--border); border-top-color:var(--sage);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .loading-box p{ font-family:'Jost',sans-serif; color:var(--muted); font-size:14px; margin:0; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Menyiapkan data admin, mohon tunggu...</p>
    </div>
  </div>

  <div class="branch-decor tl"><svg class="leaf-sway" viewBox="0 0 130 130">
    <path d="M6,120 C 26,96 22,70 40,48 C 52,34 68,25 88,10" fill="none" stroke="#6b7455" stroke-width="1.2"/>
    <path d="M40,48 C 32,41 29,31 36,23 C 44,31 43,42 40,48 Z" fill="#6b7455"/>
    <path d="M55,32 C 47,27 44,18 50,10 C 58,16 58,26 55,32 Z" fill="#6b7455" opacity=".8"/>
    <path d="M24,78 C 15,74 10,66 14,57 C 23,60 25,70 24,78 Z" fill="#6b7455" opacity=".75"/>
  </svg></div>
  <div class="branch-decor br"><svg class="leaf-sway" viewBox="0 0 150 150">
    <path d="M6,140 C 28,112 24,82 46,58 C 60,42 78,32 100,16" fill="none" stroke="#6b7455" stroke-width="1.2"/>
    <path d="M46,58 C 37,50 33,39 42,29 C 51,39 50,51 46,58 Z" fill="#6b7455"/>
    <path d="M63,37 C 54,31 51,21 58,12 C 67,19 66,30 63,37 Z" fill="#6b7455" opacity=".8"/>
    <path d="M27,90 C 17,85 12,76 17,66 C 27,70 29,81 27,90 Z" fill="#6b7455" opacity=".75"/>
  </svg></div>

  <header>
    <h1>Admin — Choco Berry &amp; Matcha</h1>
    <div class="divider-orn">
      <span class="ln"></span>
      <svg viewBox="0 0 24 24"><path d="M12,22 C12,16 10,12 12,4 C14,12 12,16 12,22 Z" fill="none" stroke="#8a7a5c" stroke-width="1"/><path d="M12,10 C9,9 7,6 8,3 C11,4 13,7 12,10 Z" fill="#6b7455"/><path d="M12,10 C15,9 17,6 16,3 C13,4 11,7 12,10 Z" fill="#6b7455"/></svg>
      <span class="ln"></span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabBtnProduk" onclick="gantiTab('produk')">Produk</div>
    <div class="tab" id="tabBtnLaporan" onclick="gantiTab('laporan')">Laporan</div>
  </div>

  <div class="container">
    <div class="frame">
      <svg class="corner c-tl" viewBox="0 0 40 40"><path d="M4,36 C14,28 12,18 20,10" fill="none" stroke="#8a7a5c" stroke-width="1"/><path d="M20,10 C16,7 15,3 18,0 C22,3 22,7 20,10 Z" fill="#6b7455"/></svg>
      <svg class="corner c-br" viewBox="0 0 40 40"><path d="M4,36 C14,28 12,18 20,10" fill="none" stroke="#8a7a5c" stroke-width="1"/><path d="M20,10 C16,7 15,3 18,0 C22,3 22,7 20,10 Z" fill="#6b7455"/></svg>

      <!-- TAB PRODUK -->
      <div id="tabProduk">
        <button class="primary" onclick="bukaModalProduk()">+ Tambah Produk</button>
        <div class="table-wrap">
          <table id="tabelProduk">
            <thead><tr><th>Kategori</th><th>Nama</th><th>Harga</th><th>Aksi</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- TAB LAPORAN -->
      <div id="tabLaporan" style="display:none;">
        <label class="field">Pilih Tanggal</label>
        <select id="selectTanggal" onchange="muatLaporan()"></select>

        <div class="table-wrap">
          <table id="tabelLaporan">
            <thead><tr><th>Produk</th><th>Qty Terjual</th><th>Pendapatan</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="card">
          <button class="secondary" onclick="toggleDetailOrder()">📋 Detail Orderan</button>
          <div class="order-btn-grid" id="orderBtnGrid" style="display:none;"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;">
          <div class="total-box" style="margin-top:0; padding:20px 12px;">
            <div class="label">TOTAL TUNAI</div>
            <div class="value" id="totalTunai" style="font-size:22px;">Rp 0</div>
          </div>
          <div class="total-box" style="margin-top:0; padding:20px 12px;">
            <div class="label">TOTAL QRIS</div>
            <div class="value" id="totalQris" style="font-size:22px;">Rp 0</div>
          </div>
        </div>
        <div class="total-box">
          <div class="label">TOTAL SEMUA PENDAPATAN</div>
          <div class="value" id="totalPendapatan">Rp 0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PRODUK -->
  <div class="overlay hidden" id="modalProduk">
    <div class="modal">
      <h2 id="modalProdukTitle">Tambah Produk</h2>
      <input type="hidden" id="produkId">
      <label class="field">Kategori</label>
      <input type="text" id="produkKategori" placeholder="Choco Berry / Matcha / Topping / dll">
      <label class="field">Nama Produk</label>
      <input type="text" id="produkNama" placeholder="Contoh: Chocoberry Kunafa">
      <label class="field">Harga (Rp)</label>
      <input type="number" id="produkHarga" placeholder="25000">
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="primary" style="flex:1;" onclick="simpanProduk()">Simpan</button>
        <button class="secondary" style="flex:1;" onclick="tutupModal('modalProduk')">Batal</button>
      </div>
    </div>
  </div>

  <!-- MODAL STRUK -->
  <div class="overlay hidden" id="modalStruk">
    <div class="modal">
      <h2>Struk Order</h2>
      <div id="strukArea"></div>
      <div class="aksi-struk-admin">
        <button class="secondary" onclick="cetakStrukAdmin()">🖨️ Cetak</button>
        <button class="secondary" onclick="unduhPDFAdmin()">⬇️ PDF</button>
        <button class="secondary" onclick="unduhJPEGAdmin()">⬇️ JPG</button>
        <button class="danger" onclick="hapusStrukOrder()">🗑️ Hapus</button>
      </div>
      <button class="primary" style="width:100%; margin-top:10px;" onclick="tutupModal('modalStruk')">Tutup</button>
    </div>
  </div>

<script type="module">
  // ============================================================
  // KONEKSI KE FIREBASE (Firestore)
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBuxFMzDOd6nqKpt1-J6LPty7O3z17dgHw",
    authDomain: "kasir-matchagato.firebaseapp.com",
    projectId: "kasir-matchagato",
    storageBucket: "kasir-matchagato.firebasestorage.app",
    messagingSenderId: "174068944280",
    appId: "1:174068944280:web:4af876debb4e061974afed"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // -------- PRODUK --------
  window.ambilProduk = async function(){
    var snap = await getDocs(collection(db, 'produk'));
    var out = [];
    snap.forEach(function(d){
      var v = d.data();
      out.push({ id: d.id, kategori: v.kategori, nama: v.nama, harga: Number(v.harga) });
    });
    return out;
  };
  window.tambahProdukFirestore = async function(kategori, nama, harga){
    var ref = await addDoc(collection(db, 'produk'), { kategori: kategori, nama: nama, harga: Number(harga) });
    return ref.id;
  };
  window.updateProdukFirestore = async function(id, kategori, nama, harga){
    await updateDoc(doc(db, 'produk', id), { kategori: kategori, nama: nama, harga: Number(harga) });
  };
  window.hapusProdukFirestore = async function(id){
    await deleteDoc(doc(db, 'produk', id));
  };

  // -------- LAPORAN / PESANAN --------
  // 1 dokumen pesanan = 1 order (berisi array 'items'). Fungsi ini
  // meratakan (flatten) semua dokumen jadi baris per-item, PERSIS
  // seperti bentuk data lama (getSemuaLaporan Apps Script), supaya
  // semua logika laporan di bawah tidak perlu diubah sama sekali.
  window.ambilSemuaLaporan = async function(){
    var snap = await getDocs(collection(db, 'pesanan'));
    var out = [];
    snap.forEach(function(d){
      var v = d.data();
      (v.items || []).forEach(function(it){
        out.push({
          orderId: d.id, tanggal: v.tanggal, waktu: v.waktu,
          kategori: it.kategori, nama: it.nama, topping: it.topping,
          qty: it.qty, hargaSatuan: it.hargaSatuan, subtotal: it.subtotal,
          metodePembayaran: v.metodePembayaran
        });
      });
    });
    return out;
  };
  window.hapusPesananFirestore = async function(orderId){
    await deleteDoc(doc(db, 'pesanan', orderId));
  };
  window.ambilHariIni = function(){
    var now = new Date();
    var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
    return now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  };

  // Kasih tahu script di bawah (yang jalan lebih dulu karena bukan
  // type="module") bahwa Firebase sudah siap dipakai.
  window.dispatchEvent(new Event('firebaseReady'));
</script>
<script>
  function formatRp(n){ return Number(n).toLocaleString('id-ID'); }
  function tutupModal(id){ document.getElementById(id).classList.add('hidden'); }
  function playEnter(el){ el.classList.remove('view-enter'); void el.offsetWidth; el.classList.add('view-enter'); }

  function gantiTab(nama){
    var tp = document.getElementById('tabProduk');
    var tl = document.getElementById('tabLaporan');
    if(nama==='produk'){ tp.style.display='block'; playEnter(tp); tl.style.display='none'; }
    else { tl.style.display='block'; playEnter(tl); tp.style.display='none'; }
    document.getElementById('tabBtnProduk').classList.toggle('active', nama==='produk');
    document.getElementById('tabBtnLaporan').classList.toggle('active', nama==='laporan');
    if(nama==='laporan') initLaporan();
  }

  // ================= PRODUK =================
  function muatProduk(){
    window.ambilProduk().then(renderProduk).catch(showError);
  }
  function renderProduk(data){
    var tbody = document.querySelector('#tabelProduk tbody');
    tbody.innerHTML = '';
    data.forEach(function(p){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>'+p.kategori+'</td><td>'+p.nama+'</td><td class="rp-bold">Rp '+formatRp(p.harga)+'</td>'+
        '<td class="actions">'+
        '<button class="secondary" onclick=\'bukaModalProduk('+JSON.stringify(p)+')\'>Edit</button>'+
        '<button class="danger" onclick="hapusProduk(\''+p.id+'\')">Hapus</button></td>';
      tbody.appendChild(tr);
    });
  }

  function bukaModalProduk(p){
    document.getElementById('modalProdukTitle').innerText = p ? 'Edit Produk' : 'Tambah Produk';
    document.getElementById('produkId').value = p ? p.id : '';
    document.getElementById('produkKategori').value = p ? p.kategori : '';
    document.getElementById('produkNama').value = p ? p.nama : '';
    document.getElementById('produkHarga').value = p ? p.harga : '';
    document.getElementById('modalProduk').classList.remove('hidden');
  }

  function simpanProduk(){
    var id = document.getElementById('produkId').value;
    var kategori = document.getElementById('produkKategori').value.trim();
    var nama = document.getElementById('produkNama').value.trim();
    var harga = Number(document.getElementById('produkHarga').value);
    if(!kategori || !nama || !harga){ alert('Lengkapi semua field'); return; }

    if(id){
      window.updateProdukFirestore(id, kategori, nama, harga).then(function(){
        tutupModal('modalProduk'); muatProduk();
      }).catch(showError);
    } else {
      window.tambahProdukFirestore(kategori, nama, harga).then(function(){
        tutupModal('modalProduk'); muatProduk();
      }).catch(showError);
    }
  }

  function hapusProduk(id){
    if(!confirm('Hapus produk ini?')) return;
    window.hapusProdukFirestore(id).then(muatProduk).catch(showError);
  }

  // ================= LAPORAN (dihitung lokal dari cache) =================
  var BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function formatTanggalIndo(iso){
    // iso berformat 'yyyy-MM-dd' -> tampilkan '7 September 2026'
    var parts = String(iso).split('-');
    if(parts.length !== 3) return iso;
    var tahun = parts[0], bulan = parseInt(parts[1],10)-1, tanggal = parseInt(parts[2],10);
    return tanggal + ' ' + (BULAN_ID[bulan] || parts[1]) + ' ' + tahun;
  }

  var semuaLaporan = [];   // cache seluruh baris transaksi, diisi sekali saat halaman dibuka
  var hariIniGlobal = '';
  var laporanInit = false;

  function daftarTanggalDariCache(){
    var set = {};
    semuaLaporan.forEach(function(r){ set[r.tanggal] = true; });
    return Object.keys(set).sort().reverse();
  }

  // Dipanggil tiap ganti tab ke Laporan -- hanya membangun dropdown tanggal
  // dari cache (tanpa panggil server lagi), makanya langsung instan.
  function initLaporan(){
    if(laporanInit) return;
    laporanInit = true;
    var list = daftarTanggalDariCache();
    var sel = document.getElementById('selectTanggal');
    sel.innerHTML = '<option value="all">Semua Hari</option>';
    list.forEach(function(tgl){
      var opt = document.createElement('option');
      opt.value = tgl;
      opt.innerText = formatTanggalIndo(tgl) + (tgl === hariIniGlobal ? ' (Hari Ini)' : '');
      if(tgl === hariIniGlobal) opt.selected = true;
      sel.appendChild(opt);
    });
    if(list.indexOf(hariIniGlobal) === -1){
      var opt2 = document.createElement('option');
      opt2.value = hariIniGlobal; opt2.innerText = formatTanggalIndo(hariIniGlobal) + ' (Hari Ini)';
      opt2.selected = true;
      sel.appendChild(opt2);
    }
    muatLaporan();
  }

  // Ganti tanggal -> filter & hitung ringkasan langsung di browser (instan,
  // tidak memanggil server). Kalau ada order baru masuk sesudah halaman
  // dibuka, refresh manual halaman untuk melihatnya di cache terbaru.
  function muatLaporan(){
    var tgl = document.getElementById('selectTanggal').value;
    var rows = (tgl === 'all') ? semuaLaporan : semuaLaporan.filter(function(r){ return r.tanggal === tgl; });

    var ringkasanMap = {};
    var orderIdsSet = {};
    var totalPendapatan = 0;
    var totalTunai = 0;
    var totalQris = 0;
    rows.forEach(function(r){
      if(!ringkasanMap[r.nama]) ringkasanMap[r.nama] = { nama: r.nama, qty: 0, total: 0 };
      ringkasanMap[r.nama].qty += r.qty;
      ringkasanMap[r.nama].total += r.subtotal;
      totalPendapatan += r.subtotal;
      var metode = String(r.metodePembayaran || 'TUNAI').toUpperCase();
      if(metode === 'QRIS') totalQris += r.subtotal;
      else totalTunai += r.subtotal;
      orderIdsSet[r.orderId] = true;
    });
    var ringkasan = Object.keys(ringkasanMap).map(function(k){ return ringkasanMap[k]; });
    ringkasan.sort(function(a,b){ return b.total - a.total; });
    var orderIds = Object.keys(orderIdsSet).sort();

    renderLaporan({ ringkasan: ringkasan, orderIds: orderIds, totalPendapatan: totalPendapatan, totalTunai: totalTunai, totalQris: totalQris });
  }

  function renderLaporan(res){
    var tbody = document.querySelector('#tabelLaporan tbody');
    tbody.innerHTML = '';
    if(res.ringkasan.length === 0){
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--muted);">Belum ada penjualan</td></tr>';
    }
    res.ringkasan.forEach(function(r){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>'+r.nama+'</td><td>'+r.qty+'</td><td class="rp-bold">Rp '+formatRp(r.total)+'</td>';
      tbody.appendChild(tr);
    });

    var grid = document.getElementById('orderBtnGrid');
    grid.innerHTML = '';
    res.orderIds.forEach(function(oid){
      var btn = document.createElement('button');
      btn.innerText = 'Order ' + oid;
      btn.onclick = function(){ lihatStruk(oid); };
      grid.appendChild(btn);
    });

    var val = document.getElementById('totalPendapatan');
    val.innerText = 'Rp ' + formatRp(res.totalPendapatan);
    document.getElementById('totalTunai').innerText = 'Rp ' + formatRp(res.totalTunai);
    document.getElementById('totalQris').innerText = 'Rp ' + formatRp(res.totalQris);
  }

  function toggleDetailOrder(){
    var grid = document.getElementById('orderBtnGrid');
    grid.style.display = grid.style.display === 'none' ? 'flex' : 'none';
  }

  // Detail struk juga langsung dari cache -> instan, tanpa panggil server.
  var currentStrukOrderId = null;
  function lihatStruk(orderId){
    currentStrukOrderId = orderId;
    var items = semuaLaporan.filter(function(r){ return String(r.orderId) === String(orderId); });
    if(!items.length){ showError(new Error('Order tidak ditemukan')); return; }
    var total = items.reduce(function(s,it){ return s + it.subtotal; }, 0);
    var tanggal = items[0].tanggal, waktu = items[0].waktu;

    var html = '<div class="center"><b>CHOCO BERRY & MATCHA</b><br>Struk Pesanan</div><hr>';
    items.forEach(function(it){
      html += '<div><b>'+it.nama+'</b></div>';
      if(it.topping) html += '<div>+ '+it.topping+'</div>';
      html += '<div class="row"><span>'+it.qty+' x Rp '+formatRp(it.hargaSatuan)+'</span><span>Rp '+formatRp(it.subtotal)+'</span></div>';
    });
    html += '<hr><div class="row"><b>TOTAL</b><b>Rp '+formatRp(total)+'</b></div>';
    html += '<div class="row"><span>Metode Bayar</span><span>'+(items[0].metodePembayaran || '-')+'</span></div><hr>';
    html += '<div class="center">'+tanggal+' '+waktu+'</div>';
    html += '<div class="center" style="font-weight:bold;">No. Order: '+orderId+'</div>';
    document.getElementById('strukArea').innerHTML = html;
    document.getElementById('modalStruk').classList.remove('hidden');
  }

  // ================= AKSI STRUK: CETAK / UNDUH / HAPUS =================
  function cetakStrukAdmin(){ window.print(); }

  function unduhJPEGAdmin(){
    html2canvas(document.getElementById('strukArea'), {backgroundColor:'#ffffff', scale:2}).then(function(canvas){
      var link = document.createElement('a');
      link.download = 'struk-'+currentStrukOrderId+'.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  }

  function unduhPDFAdmin(){
    html2canvas(document.getElementById('strukArea'), {backgroundColor:'#ffffff', scale:2}).then(function(canvas){
      var imgData = canvas.toDataURL('image/png');
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ unit:'px', format:[canvas.width, canvas.height] });
      pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
      pdf.save('struk-'+currentStrukOrderId+'.pdf');
    });
  }

  function hapusStrukOrder(){
    if(!currentStrukOrderId) return;
    if(!confirm('Hapus order '+currentStrukOrderId+'? Data transaksi ini akan dihapus permanen dari Laporan.')) return;
    window.hapusPesananFirestore(currentStrukOrderId).then(function(){
      // Buang dari cache lokal supaya laporan & dropdown ikut update tanpa reload
      semuaLaporan = semuaLaporan.filter(function(r){ return String(r.orderId) !== String(currentStrukOrderId); });
      tutupModal('modalStruk');
      muatLaporan();
    }).catch(showError);
  }

  function showError(err){
    alert('Terjadi kesalahan: ' + (err.message || err));
  }

  function hideLoading(){
    var ov = document.getElementById('loadingOverlay');
    if(ov) ov.classList.add('hidden');
  }

  // ================= LOAD AWAL =================
  // Semua data (produk + seluruh transaksi + tanggal hari ini) ditarik
  // SEKALI di sini saat halaman dibuka. Sesudah ini, ganti tab/tanggal dan
  // lihat detail order semuanya proses lokal (instan). Kalau ada order
  // baru masuk, refresh manual halaman untuk memuat ulang cache-nya.
  function initApp(){
    Promise.all([
      window.ambilProduk(),
      window.ambilSemuaLaporan(),
      Promise.resolve(window.ambilHariIni())
    ]).then(function(hasil){
      renderProduk(hasil[0]);
      semuaLaporan = hasil[1];
      hariIniGlobal = hasil[2];
      hideLoading();
    }).catch(function(err){
      hideLoading();
      showError(err);
    });
  }

  // Firebase (script type="module") dieksekusi belakangan (ditunda),
  // jadi kadang window.ambilProduk dkk belum ada saat baris di bawah
  // ini pertama kali jalan. Kalau belum siap, tunggu 'firebaseReady'.
  if(window.ambilProduk){
    initApp();
  } else {
    window.addEventListener('firebaseReady', initApp);
  }
</script>
</body>
</html>
