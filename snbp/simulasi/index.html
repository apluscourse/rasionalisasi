<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar PTN - Supabase</title>

  <!-- 1. WAJIB: Load CDN Supabase di bagian HEAD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
      background-color: #f8f9fa;
    }
    h2 { color: #2c3e50; margin-bottom: 16px; }
    #status {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .loading { background-color: #e2e3e5; color: #383d41; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background-color: #007bff; color: white; font-weight: 600; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #f1f3f5; }
  </style>
</head>
<body>

  <h2>Daftar PTN & Program Studi</h2>
  <div id="status" class="loading">Memuat data dari Supabase...</div>

  <table id="ptn-table" style="display: none;">
    <thead>
      <tr>
        <th style="width: 50px;">No</th>
        <th>Nama PTN</th>
        <th>Program Studi (Prodi)</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <!-- 2. Jalankan logika JavaScript di bawah setelah HTML dimuat -->
  <script>
    const SUPABASE_URL = 'https://dwmmckxdsvcvnqruekwy.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3bW1ja3hkc3Zjdm5xcnVla3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTU3OTEsImV4cCI6MjEwMDkzMTc5MX0.kERdmDc8_VBgH9mJKHVMhmwaX9dLxhz7onaTZKIqdZY'

    // Gunakan 'window.supabase' agar dipastikan membaca library dari CDN
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function fetchPTN() {
      const statusEl = document.getElementById('status')
      const tableEl = document.getElementById('ptn-table')
      const tbodyEl = document.getElementById('table-body')

      try {
        // Query ke nama tabel baru: 'data_ptn'
        const { data, error } = await supabaseClient
          .from('data_ptn') 
          .select('PTN, PRODI')

        if (error) throw error

        if (!data || data.length === 0) {
          statusEl.className = 'error'
          statusEl.innerText = 'Koneksi berhasil, tetapi tabel "data_ptn" masih kosong.'
          return
        }

        statusEl.className = 'success'
        statusEl.innerText = `Berhasil memuat ${data.length} data dari Supabase!`

        tbodyEl.innerHTML = data.map((item, index) => `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${item.PTN || '-'}</strong></td>
            <td>${item.PRODI || '-'}</td>
          </tr>
        `).join('')

        tableEl.style.display = 'table'

      } catch (err) {
        console.error('Detail Error:', err)
        statusEl.className = 'error'
        statusEl.innerText = 'Gagal memuat data! Cek console browser.'
      }
    }

    fetchPTN()
  </script>

</body>
</html>
